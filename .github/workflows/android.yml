name: Android CI

on:
  push:
    branches: [ "feat/android-client" ]
  pull_request:
    branches: [ "feat/android-client" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Download and setup gradle wrapper
      run: |
        curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip gradle.zip
        mkdir -p gradle/wrapper
        find . -name "gradle-wrapper*.jar" -exec cp {} gradle/wrapper/gradle-wrapper.jar \;

    - name: Commit gradle-wrapper.jar
      uses: EndBug/add-and-commit@v9
      with:
        add: 'gradle/wrapper/gradle-wrapper.jar'
        message: 'chore: Add gradle-wrapper.jar'
        author_name: Jules
        author_email: jules@example.com

    - name: set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
